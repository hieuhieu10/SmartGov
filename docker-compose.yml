services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: officeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-officeai}
      POSTGRES_USER: ${POSTGRES_USER:-officeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - officeai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-officeai} -d ${POSTGRES_DB:-officeai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    build: ./OCR
    platform: linux/amd64
    container_name: officeai-ocr
    restart: unless-stopped
    environment:
      REPO_FILES_DIR: /app/repo_files
      PADDLEOCR_LANG: vi
      OCR_PDF_DPI: 180
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - officeai-repofiles:/app/repo_files
      - officeai-ocr-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai:
    build: ./AI
    platform: linux/amd64
    container_name: officeai-ai
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      AI_ENGINE: ${AI_ENGINE:-notebooklm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME:-your-model}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_FALLBACK_BASE_URL: ${VLLM_FALLBACK_BASE_URL:-}
      VLLM_FALLBACK_MODEL_NAME: ${VLLM_FALLBACK_MODEL_NAME:-}
      VLLM_FALLBACK_API_KEY: ${VLLM_FALLBACK_API_KEY:-}
      OCR_VLLM_BASE_URL: ${OCR_VLLM_BASE_URL:-http://host.docker.internal:8686/v1}
      OCR_VLLM_MODEL_NAME: ${OCR_VLLM_MODEL_NAME:-your-vision-model}
      OCR_VLLM_API_KEY: ${OCR_VLLM_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api-inference.huggingface.co/models/dangvantuan/vietnamese-embedding}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-dangvantuan/vietnamese-embedding}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_CHUNK_SIZE: ${EMBEDDING_CHUNK_SIZE:-1200}
      OCR_SERVICE_URL: http://ocr:7100
    env_file:
      - path: ./AI/.env
        required: false
    volumes:
      - officeai-uploads:/app/uploads
      - officeai-outputs:/app/outputs
      - officeai-repofiles:/app/repo_files
      - officeai-templates:/app/user_templates
      - type: bind
        source: ${NOTEBOOKLM_HOME:?NOTEBOOKLM_HOME is required}
        target: /root/.notebooklm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      ocr:
        condition: service_healthy

  be:
    build: ./BE
    platform: linux/amd64
    container_name: officeai-be
    restart: unless-stopped
    ports:
      - "6868:6868"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-officeai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-officeai}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_SERVICE_URL: http://ai:7000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_VECTOR_CANDIDATES: ${RAG_VECTOR_CANDIDATES:-30}
      RAG_TEXT_CANDIDATES: ${RAG_TEXT_CANDIDATES:-30}
      RAG_VECTOR_WEIGHT: ${RAG_VECTOR_WEIGHT:-0.6}
      RAG_TEXT_WEIGHT: ${RAG_TEXT_WEIGHT:-1.4}
    env_file:
      - path: ./BE/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - officeai-uploads:/app/uploads
      - officeai-outputs:/app/outputs
      - officeai-repofiles:/app/repo_files
      - officeai-templates:/app/user_templates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6868/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  fe:
    build: ./FE
    container_name: officeai-fe
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      be:
        condition: service_healthy

volumes:
  officeai-postgres:
  officeai-uploads:
  officeai-outputs:
  officeai-repofiles:
  officeai-ocr-models:
  officeai-templates:
